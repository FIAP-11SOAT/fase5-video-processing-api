apiVersion: apps/v1
kind: Deployment
metadata:
  name: fase5-video-processing-api
  namespace: fase5-video-processing-api
  labels:
    app: fase5-video-processing-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fase5-video-processing-api
  template:
    metadata:
      labels:
        app: fase5-video-processing-api
    spec:
      containers:
      - name: fase5-video-processing-api
        image: kennethreitz/fase5-video-processing-api:latest
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 10